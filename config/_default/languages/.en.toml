# Change single params to "false" to remove from rendering
[params]
  subtitle = "Politics, food & community" # This goes in the header and in the site title
  # PAGES
  [params.homepage]
    # Notice that SEO meta tags (what appears in google search results) can be set
    # in individual pages frontmatters `/content/<page>`
    ###
    preTitle = ''
    title = "George Wolff"
    # You can use some markdown safely here as long as you don't include line breaks
    intro= """
I'm a politics and international development student at the University of Birmingham. I am about to start my Year in Civic Leadership with the charity, Citizens. 

This site is where I think out loud — about civic life, community, politics, hobbies, and whatever else I'm working through.
        """
    mainButton = "Features"
    mainButtonRef = "features" # Just write the name or slug of the page here
    secondButton = "Contacts"
    secondButtonRef = "contacts" # Just write the name or slug of the page here
  # For the blog feed section (visible only if posts are rendered)
    blogTitle = "Interesting Stories"
    blogButton= "More Stories"

