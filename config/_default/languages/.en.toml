[params.services]
  title = "About"
    description = """This site is a record of what I'm thinking and doing, without the performance that comes with social media. Expect notes on books I'm reading, systems I'm testing, and observations made along the way.<br><br>I'm currently putting down roots in Birmingham, studying Politics and International Development and figuring out what a well-lived life looks like in practice.<br><br>I'm interested in the role of non-state institutions in civic life. Communities create belonging, provide essential services, and build resilience. This has shaped my involvement with organisations like InterVol, Sense, and Citizens."""
  [params.services.list]
